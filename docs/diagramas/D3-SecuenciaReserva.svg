 1029.0,540.0" fill="#174a31"/><text x="930.0" y="538.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">8  insert_one({franjas, estado: "activa"})</text><polyline points="1040,585 820,585" fill="none" stroke="#174a31" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="820,585 831.0,580.0 831.0,590.0" fill="#174a31"/><text x="930.0" y="578.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#174a31" text-anchor="middle" xml:space="preserve">índice único: OK  o  DuplicateKeyError</text><polyline points="820,625 290,625" fill="none" stroke="#174a31" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="290,625 301.0,620.0 301.0,630.0" fill="#174a31"/><text x="555.0" y="618.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#174a31" text-anchor="middle" xml:space="preserve">9  201 reserva creada  ·  409 "Ese horario ya está ocupado"</text><polyline points="290,665 100,665" fill="none" stroke="#174a31" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="100,665 111.0,660.0 111.0,670.0" fill="#174a31"/><text x="195.0" y="658.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#174a31" text-anchor="middle" xml:space="preserve">10  confirma · con 409 recarga la regleta</text><rect x="30" y="700" width="1110" height="60" rx="0" fill="#f4f5ef" stroke="#dde1da" stroke-width="1"/><text x="36.0" y="726.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">Clave: el precio lo calcula el servidor (Reservas.py:94) y el cruce lo impide la base con el índice único parcial ux_cancha_franja_activa (Reservas.py:132-135).</text><text x="36.0" y="741.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">Archivos: Detalle.jsx:110 · Api.js:24 · Seguridad.py:65 y :85 · Modelos.py:104 · Reservas.py:36-62, :83-94, :132-135 · Detalle.jsx:133</text><text x="30.0" y="786.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555a61" text-anchor="start" xml:space="preserve">Rojo = respuestas de error (la reserva no se crea). Verde oscuro = camino feliz.</text></svg>