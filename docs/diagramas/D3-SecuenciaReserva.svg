<svg xmlns="http://www.w3.org/2000/svg" width="1169" height="827" viewBox="0 0 1169 827"><rect width="100%" height="100%" fill="#ffffff"/><text x="30.0" y="40.1" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#174a31" text-anchor="start" xml:space="preserve" font-weight="bold">D3 · Secuencia de una reserva, de punta a punta</text><text x="30.0" y="62.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555a61" text-anchor="start" xml:space="preserve">Ejemplo: Pista 3, mañana 9 p. m. (hora pico). Flecha continua = llamada · discontinua = respuesta. Números = pasos del guion. FastAPI revisa la sesión antes que el cuerpo.</text><line x1="30" y1="74" x2="1139" y2="74" stroke="#1d5a3c" stroke-width="1.5"/><rect x="20" y="92" width="160" height="44" rx="0" fill="#f4f5ef" stroke="#1d5a3c" stroke-width="1"/><text x="100.0" y="110.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve" font-weight="bold">Jugador</text><text x="100.0" y="125.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve" font-weight="bold">Regleta · Detalle.jsx</text><polyline points="100,136 100,770" fill="none" stroke="#dde1da" stroke-width="1" stroke-dasharray="6 4"/><rect x="210" y="92" width="160" height="44" rx="0" fill="#f4f5ef" stroke="#1d5a3c" stroke-width="1"/><text x="290.0" y="110.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve" font-weight="bold">Api.js</text><text x="290.0" y="125.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve" font-weight="bold">(único cliente HTTP)</text><polyline points="290,136 290,770" fill="none" stroke="#dde1da" stroke-width="1" stroke-dasharray="6 4"/><rect x="390" y="92" width="160" height="44" rx="0" fill="#f4f5ef" stroke="#1d5a3c" stroke-width="1"/><text x="470.0" y="11