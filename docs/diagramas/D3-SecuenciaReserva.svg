ht="bold">reservas</text><polyline points="1040,136 1040,770" fill="none" stroke="#dde1da" stroke-width="1" stroke-dasharray="6 4"/><polyline points="100,170 290,170" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="290,170 279.0,175.0 279.0,165.0" fill="#174a31"/><text x="195.0" y="163.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">1-2  elige hora · reservar() arma el cuerpo (sin precio)</text><polyline points="290,215 470,215" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="470,215 459.0,220.0 459.0,210.0" fill="#174a31"/><text x="380.0" y="208.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">3  POST /api/reservas · Bearer JWT</text><polyline points="470,250 640,250" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="640,250 629.0,255.0 629.0,245.0" fill="#174a31"/><text x="555.0" y="243.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">4  solo_cliente: JWT y rol</text><polyline points="640,285 290,285" fill="none" stroke="#c23a12" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="290,285 301.0,280.0 301.0,290.0" fill="#c23a12"/><text x="465.0" y="278.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c23a12" text-anchor="middle" xml:space="preserve">401 sin token · 403 otro rol</text><polyline points="470,310 504,310 504,326 474,326" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="474,326 485.0,321.0 485.0,331.0" fill="#174a31"/><text x="510.0" y="318.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">5  ReservaEntrada</text><text x="510.0" y="333.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">(horas 1..3, fecha)</text><polyline poi