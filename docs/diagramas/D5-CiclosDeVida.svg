<svg xmlns="http://www.w3.org/2000/svg" width="1169" height="827" viewBox="0 0 1169 827"><rect width="100%" height="100%" fill="#ffffff"/><text x="30.0" y="40.1" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#174a31" text-anchor="start" xml:space="preserve" font-weight="bold">D5 · Ciclos de vida: reserva y partido abierto</text><text x="30.0" y="62.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555a61" text-anchor="start" xml:space="preserve">Estados reales del campo estado (reservas.estado y reservas.partido_abierto.estado) y qué los cambia.</text><line x1="30" y1="74" x2="1139" y2="74" stroke="#1d5a3c" stroke-width="1.5"/><text x="30.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#174a31" text-anchor="start" xml:space="preserve" font-weight="bold">Reserva o bloqueo (reservas.estado)</text><rect x="40" y="160" width="22" height="22" rx="6" fill="#24272c" stroke="#24272c" stroke-width="1"/><rect x="200" y="148" width="150" height="46" rx="6" fill="#1d5a3c" stroke="#174a31" stroke-width="1"/><text x="275.0" y="175.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f4f5ef" text-anchor="middle" xml:space="preserve" font-weight="bold">activa</text><rect x="120" y="330" width="150" height="46" rx="6" fill="#f4f5ef" stroke="#174a31" stroke-width="1"/><text x="195.0" y="357.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24272c" text-anchor="middle" xml:space="preserve" font-weight="bold">cancelada</text><rect x="360" y="330" width="150" height="46" rx="6" fill="#f4f5ef" stroke="#174a31" stroke-width="1"/><text x="435.0" y="357.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24272c" text-anchor="middle" xml:space="preserve" font-weight="bold">finalizada</text><polyline points="62,171 200,171" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="200,171 189.0,176.0 189.0,166.0" fill="#174a31"/><text x="56.0" y="133.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">POST /api/reservas</text><text x="56.0" y="148.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">POST /reservas/bloqueos</text><polyline points="240,194 240,260 195,260 195,330" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="195,330 190.0,319.0 200.0,319.0" fill="#174a31"/><text x="30.0" y="275.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">Jugador cancela con ≥ 24 h</text><text x="30.0" y="290.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">(Reservas.py:156-187)</text><text x="30.0" y="305.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">o el dueño quita el bloqueo</text><text x="30.0" y="320.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">(Reservas.py:253-262)</text><polyline points="320,194 320,260 435,260 435,330" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="435,330 430.0,319.0 440.0,319.0" fill="#174a31"/><text x="330.0" y="216.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">Ya pasó hora_fin: FinalizarReservas</text><text x="330.0" y="231.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">o POST /admin/mantenimiento/</text><text x="330.0" y="246.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">finalizar-reservas (CicloDeVida.py:32)</text><rect x="30" y="410" width="520" height="132" rx="0" fill="#f4f5ef" stroke="#dde1da" stroke-width="1"/><text x="36.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Solo "activa" está en el índice único parcial: al cancelar o finalizar, la franja deja de ocupar el índice.</text><text x="36.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Al cancelar: pago.estado → reembolsado y, si había partido, partido_abierto.estado → cerrado.</text><text x="36.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Cancelar exige estado activa en el filtro de find_one_and_update: dos cancelaciones</text><text x="36.0" y="471.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">  simultáneas no se pisan.</text><text x="36.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· La finalización no es automática: la corre el admin o el script (idempotente).</text><text x="36.0" y="501.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Errores: cancelar una finalizada → 409 "Esta reserva ya se jugó"; una cancelada → 409.</text><text x="600.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#174a31" text-anchor="start" xml:space="preserve" font-weight="bold">Partido abierto (partido_abierto.estado)</text><rect x="610" y="160" width="22" height="22" rx="6" fill="#24272c" stroke="#24272c" stroke-width="1"/><rect x="760" y="148" width="150" height="46" rx="6" fill="#1d5a3c" stroke="#174a31" stroke-width="1"/><text x="835.0" y="175.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f4f5ef" text-anchor="middle" xml:space="preserve" font-weight="bold">abierto</text><rect x="990" y="148" width="150" height="46" rx="6" fill="#1d5a3c" stroke="#174a31" stroke-width="1"/><text x="1065.0" y="175.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f4f5ef" text-anchor="middle" xml:space="preserve" font-weight="bold">completo</text><rect x="870" y="330" width="150" height="46" rx="6" fill="#f4f5ef" stroke="#174a31" stroke-width="1"/><text x="945.0" y="357.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#24272c" text-anchor="middle" xml:space="preserve" font-weight="bold">cerrado</text><polyline points="632,171 760,171" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="760,171 749.0,176.0 749.0,166.0" fill="#174a31"/><text x="610.0" y="207.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">Reserva con</text><text x="610.0" y="222.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">abierta = true y</text><text x="610.0" y="237.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">modalidad ≥ 4</text><text x="610.0" y="252.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">jugadores</text><polyline points="910,162 990,162" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="990,162 979.0,167.0 979.0,157.0" fill="#174a31"/><text x="955.0" y="125.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">se une el</text><text x="955.0" y="140.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">último cupo</text><polyline points="990,182 910,182" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="910,182 921.0,177.0 921.0,187.0" fill="#174a31"/><text x="950.0" y="201.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">alguien</text><text x="950.0" y="216.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">sale</text><polyline points="835,194 835,353 870,353" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="870,353 859.0,358.0 859.0,348.0" fill="#174a31"/><polyline points="1065,194 1065,353 1020,353" fill="none" stroke="#174a31" stroke-width="1.5"/><polygon points="1020,353 1031.0,348.0 1031.0,358.0" fill="#174a31"/><text x="945.0" y="297.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">el organizador</text><text x="945.0" y="312.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="middle" xml:space="preserve">cancela la reserva</text><rect x="600" y="410" width="540" height="132" rx="0" fill="#f4f5ef" stroke="#dde1da" stroke-width="1"/><text x="606.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Unirse: hasta 2 h antes, con una sola find_one_and_update que exige cupo, que no seas el</text><text x="606.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">  organizador y que no estés ya unido (Partidos.py:90-104).</text><text x="606.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Cuota = precio_total / cupos, redondeada hacia arriba a la centena (Reservas.py:126).</text><text x="606.0" y="471.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Salir: siempre que no haya empezado; la cuota se devuelve solo con ≥ 24 h (Partidos.py:129-151).</text><text x="606.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#24272c" text-anchor="start" xml:space="preserve">· Si la reserva queda finalizada, unirse o salir responde 409 "Este partido ya se jugó".</text><text x="30.0" y="586.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555a61" text-anchor="start" xml:space="preserve">Caja verde = estado vivo (puede cambiar) · Caja clara = estado final · Punto negro = creación.</text><text x="30.0" y="601.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555a61" text-anchor="start" xml:space="preserve">Las transiciones con hora usan la hora del SERVIDOR en Bogotá (Utilidades.py: ahora()).</text></svg>